[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-companion"
dynamic = ["version"]
description = "An electric penguin that lives on your desktop, answers with any AI, and reacts to your coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Randy Northrup" }]
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.5"]
keywords = ["desktop pet", "companion", "ai", "agents", "claude", "codex", "gemini", "reminders"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Desktop Environment",
]

[project.optional-dependencies]
battery = ["psutil"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/RandyNorthrup/penguin-companion"
Issues = "https://github.com/RandyNorthrup/penguin-companion/issues"

[project.scripts]
penguin-companion = "penguin_companion.cli:main"

[tool.setuptools]
packages = ["penguin_companion"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "penguin_companion.__version__" }

[tool.setuptools.package-data]
penguin_companion = [
    "anim/*.png",
    "anim/manifest.json",
    "integrations/claude/.claude-plugin/marketplace.json",
    "integrations/claude/penguin-companion/.claude-plugin/plugin.json",
    "integrations/claude/penguin-companion/hooks/hooks.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
